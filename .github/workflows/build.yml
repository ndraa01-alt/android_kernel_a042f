name: Kernel Build

on:
  push:
    branches: [ main ] # Trigger workflow saat ada push ke branch main
  workflow_dispatch: # Trigger workflow secara manual

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Penting untuk submodule dan history

      - name: Set up environment
        run: |
          sudo apt update
          sudo apt install -y git bc bison flex libncurses5-dev libssl-dev cpio
          # Tambahkan dependencies lain yang dibutuhkan oleh build_kernel.sh

      - name: Download Toolchains (Jika belum ada di repo)
        run: |
          # Contoh jika toolchains tidak ada di repo dan perlu di download
          # Anda perlu mengganti URL dengan URL yang sesuai
          # mkdir -p toolchains
          # wget -q https://example.com/arm-gnu-toolchain.tar.xz -O toolchains/arm-gnu-toolchain.tar.xz
          # tar -xf toolchains/arm-gnu-toolchain.tar.xz -C toolchains
          # wget -q https://example.com/clang.tar.xz -O toolchains/clang.tar.xz
          # tar -xf toolchains/clang.tar.xz -C toolchains
          echo "Toolchains sudah ada di repository atau sudah di download"

      - name: Make AIK-Linux executable
        run: chmod +x AIK-Linux/repackimg.sh

      - name: Build Kernel
        run: bash build_kernel.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build
          path: build/*.tar # Atau path yang sesuai dengan hasil build Anda

      - name: Create Release (Optional)
        uses: ncipollo/release-action@v1
        if: github.ref == 'refs/heads/main' # Hanya buat release dari branch main
        with:
          tag: latest
          name: Kernel Build - Latest
          artifacts: build/*.tar # Atau path yang sesuai